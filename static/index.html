<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Viscan Voice Assistant (PoC)</title>
<style>
  :root {
    --bg: #f5f6f4; --panel: #ffffff; --ink: #1d2422; --muted: #66706c; --line: #dfe3e0;
    --accent: #0f6e63; --accent-soft: #e2f1ee; --warn: #8a5a00; --warn-soft: #fff4dc;
    --bad: #a3322b; --bad-soft: #fbe7e5; --ok: #1d6b3a; --ok-soft: #e3f3e8; --chip: #eef0ee;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--ink); }
  header { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between;
           padding: 12px 20px; background: var(--panel); border-bottom: 1px solid var(--line); }
  header h1 { font-size: 17px; margin: 0; }
  header h1 span { color: var(--muted); font-weight: 400; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; font-size: 13px; }
  .chip { background: var(--chip); border-radius: 999px; padding: 3px 10px; }
  select, button, textarea, input { font: inherit; }
  select { padding: 4px 8px; border: 1px solid var(--line); border-radius: 6px; background: #fff; }
  main { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; padding: 16px 20px; max-width: 1400px; margin: 0 auto; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; padding: 12px 16px; } }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; display: flex; flex-direction: column; min-height: 0; }
  .panel h2 { font-size: 14px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0; padding: 12px 16px; border-bottom: 1px solid var(--line); }
  #log { flex: none; overflow-y: auto; padding: 14px 16px; height: 58vh; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 92%; padding: 9px 12px; border-radius: 10px; white-space: pre-wrap; word-wrap: break-word; }
  .msg.user { align-self: flex-end; background: var(--accent); color: #fff; }
  .msg.user .via { font-size: 11px; opacity: .8; display: block; }
  .msg.bot { align-self: flex-start; background: var(--chip); }
  .badge { display: inline-block; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; padding: 1px 7px; border-radius: 4px; margin-bottom: 4px; background: #fff; color: var(--accent); }
  .badge.clarification, .badge.not_found, .badge.unsupported { color: var(--warn); }
  .badge.error { color: var(--bad); }
  .warn { background: var(--warn-soft); color: var(--warn); border-radius: 6px; padding: 5px 8px; margin-top: 6px; font-size: 13px; }
  .cands { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .cands button { border: 1px solid var(--accent); background: #fff; color: var(--accent); border-radius: 6px; padding: 4px 9px; cursor: pointer; font-size: 13px; }
  details.trace { margin-top: 6px; font-size: 12px; }
  details.trace pre { font-family: var(--mono); font-size: 11.5px; background: #fff; border: 1px solid var(--line); border-radius: 6px; padding: 8px; overflow-x: auto; white-space: pre; max-height: 260px; }
  .composer { border-top: 1px solid var(--line); padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  textarea#text { flex: 1; min-width: 0; resize: vertical; min-height: 44px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; }
  .btn { border: 0; border-radius: 8px; padding: 9px 14px; cursor: pointer; background: var(--accent); color: #fff; font-weight: 600; }
  .btn.secondary { background: #fff; color: var(--accent); border: 1px solid var(--accent); }
  .btn.mic.listening { background: var(--bad); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .examples { display: flex; gap: 6px; flex-wrap: wrap; }
  .examples button { border: 1px dashed var(--line); background: #fff; border-radius: 999px; padding: 3px 10px; font-size: 12.5px; cursor: pointer; color: var(--muted); }
  .hint { font-size: 12px; color: var(--muted); }
  #detail { padding: 14px 16px; overflow-y: auto; max-height: calc(58vh + 190px); }
  #detail .empty { color: var(--muted); }
  .pt { display: flex; flex-wrap: wrap; gap: 8px; align-items: baseline; margin-bottom: 6px; }
  .pt strong { font-size: 16px; }
  .meta { color: var(--muted); font-size: 13px; }
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; margin: 8px 0; }
  th, td { text-align: left; padding: 6px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-size: 12px; color: var(--muted); font-weight: 600; }
  tr.hit td { background: var(--accent-soft); }
  .neg { color: var(--muted); }
  .flag { color: var(--warn); font-size: 12px; }
  .ev { font-size: 12px; color: var(--muted); font-style: italic; }
  .block { margin: 10px 0; }
  .block h3 { font-size: 13px; margin: 0 0 4px; color: var(--muted); text-transform: uppercase; letter-spacing: .03em; }
  pre.draft { font-family: var(--mono); font-size: 12.5px; background: #fbfbfa; border: 1px solid var(--line); border-radius: 8px; padding: 10px; white-space: pre-wrap; }
  textarea.json { width: 100%; min-height: 200px; font-family: var(--mono); font-size: 12px; border: 1px solid var(--line); border-radius: 8px; padding: 8px; }
  .status { display: inline-block; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 4px; background: var(--warn-soft); color: var(--warn); }
  .status.clinician_approved { background: var(--ok-soft); color: var(--ok); }
  .rejected { background: var(--bad-soft); color: var(--bad); border-radius: 6px; padding: 6px 8px; font-size: 13px; margin: 6px 0; }
  .src { font-family: var(--mono); font-size: 11.5px; color: var(--accent); }
</style>
</head>
<body>
<header>
  <h1>Viscan Voice Assistant <span>· proof of concept · synthetic data only</span></h1>
  <div class="chips">
    <span class="chip" id="cfg-interp">interpreter: …</span>
    <span class="chip" id="cfg-stt">server STT: …</span>
    <label class="chip">clinician
      <select id="clinician"><option value="dr_demo">dr_demo (BLR-01)</option><option value="dr_mysuru">dr_mysuru (MYS-02)</option></select>
    </label>
    <button class="btn secondary" id="reset" type="button">New session</button>
  </div>
</header>

<main>
  <section class="panel" aria-label="Conversation">
    <h2>Conversation</h2>
    <div id="log" aria-live="polite"></div>
    <div class="composer">
      <div class="examples" id="examples"></div>
      <div class="row">
        <textarea id="text" rows="2" placeholder="Type or press the mic: e.g. Open Priya's latest OPG report"></textarea>
      </div>
      <div class="row">
        <select id="mode" aria-label="Mode">
          <option value="auto">Auto-detect</option>
          <option value="command">Command</option>
          <option value="dictation">Dictation</option>
        </select>
        <button class="btn mic" id="mic" type="button">🎤 Speak</button>
        <button class="btn" id="send" type="button">Send</button>
        <label class="hint">or upload audio <input type="file" id="audio" accept="audio/*"></label>
      </div>
      <div class="hint" id="mic-hint"></div>
    </div>
  </section>

  <section class="panel" aria-label="Evidence">
    <h2>Evidence / draft</h2>
    <div id="detail"><p class="empty">Reports, summaries and dictation drafts appear here, with the source finding IDs highlighted.</p></div>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
const state = { sessionId: null, clinician: "dr_demo", draft: null };
const EXAMPLES = [
  "Open Priya's latest OPG report", "Priya Sharma", "Summarize her report", "Does she have any caries?",
  "What about 48?", "Open Arjun Nair's CBCT",
  "Lower right third molar is horizontally impacted with roots close to the mandibular canal. Possible caries on 46. No periapical radiolucency in relation to 36."
];

function el(tag, attrs = {}, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") n.className = v; else if (k.startsWith("on")) n.addEventListener(k.slice(2), v); else n.setAttribute(k, v);
  }
  for (const k of kids.flat()) if (k !== null && k !== undefined) n.append(k.nodeType ? k : document.createTextNode(String(k)));
  return n;
}

async function api(path, opts = {}) {
  const headers = { "X-Clinician-Id": state.clinician, ...(opts.headers || {}) };
  if (opts.json !== undefined) { headers["Content-Type"] = "application/json"; opts.body = JSON.stringify(opts.json); }
  const res = await fetch(path, { method: opts.method || "GET", headers, body: opts.body });
  let data = null;
  try { data = await res.json(); } catch (_) {}
  if (!res.ok) {
    const d = data && data.detail;
    const msg = (d && d.message) || (Array.isArray(d) ? d.map(e => e.msg).join("; ") : null) || (data && data.message) || res.statusText;
    throw new Error(msg);
  }
  return data;
}

function addUser(text, via) {
  $("log").append(el("div", { class: "msg user" }, via ? el("span", { class: "via" }, via) : null, text));
  $("log").scrollTop = $("log").scrollHeight;
}

function addBot(r) {
  const box = el("div", { class: "msg bot" }, el("span", { class: "badge " + r.type }, r.type.replace("_", " ")), el("br"), r.message);
  for (const w of r.warnings || []) box.append(el("div", { class: "warn" }, "⚠ " + w));
  const fb = (r.trace || []).find(s => s.step === "interpret_fallback");
  if (fb) box.append(el("div", { class: "warn" }, `⚠ LLM unavailable (${fb.detail.error}); answered by the rule-based interpreter.`));
  const llm = (r.trace || []).find(s => s.step === "interpret" && s.detail.engine !== "rule_based");
  if (llm && llm.detail.usage) box.append(el("div", { class: "hint" },
    `${llm.detail.engine} · ${llm.detail.usage.model} · ${llm.ms} ms · ${llm.detail.usage.input_tokens} in` +
    (llm.detail.usage.cached_tokens ? ` (${llm.detail.usage.cached_tokens} cached)` : "") + ` + ${llm.detail.usage.output_tokens} out tokens` +
    (llm.detail.usage.est_cost_usd ? ` · ~$${llm.detail.usage.est_cost_usd}` : " · free tier")));
  const cands = r.data && r.data.candidates;
  if (cands && cands.length) {
    box.append(el("div", { class: "cands" }, cands.map(c => el("button", { type: "button", onclick: () => send(c.patient_id) },
      `${c.name} · ${c.patient_id} · ${c.age}${c.sex}` + (c.latest_report ? ` · last ${c.latest_report}` : "")))));
  }
  if (r.trace && r.trace.length) {
    const lines = r.trace.map(s => `${s.step}${s.ms != null ? ` (${s.ms} ms)` : ""}\n  ${JSON.stringify(s.detail)}`).join("\n");
    box.append(el("details", { class: "trace" }, el("summary", {}, `trace · ${r.total_ms} ms`), el("pre", {}, lines)));
  }
  $("log").append(box);
  $("log").scrollTop = $("log").scrollHeight;
}

function addNote(msg) {
  $("log").append(el("div", { class: "hint", style: "align-self:center" }, msg));
}

function addError(msg) {
  $("log").append(el("div", { class: "msg bot" }, el("span", { class: "badge error" }, "error"), el("br"), msg));
}

function siteText(site) { return /^\d{2}$/.test(site) ? "Tooth " + site : site.charAt(0).toUpperCase() + site.slice(1); }
function fill(node, ...kids) { node.replaceChildren(...kids.flat().filter(k => k !== null && k !== undefined && k !== false)); }

function renderReport(d, hits) {
  const r = d.report, p = d.patient, hit = new Set(hits || []);
  const rows = r.findings.map(f => el("tr", { class: hit.has(f.id) ? "hit" : "" },
    el("td", { class: "src" }, f.id), el("td", {}, siteText(f.site)),
    el("td", { class: f.present ? "" : "neg" }, f.present ? f.text : "Not seen: " + f.text)));
  fill($("detail"),
    el("div", { class: "pt" }, el("strong", {}, p.name), el("span", { class: "meta" }, `${p.patient_id} · ${p.age} y · ${p.sex}`)),
    el("div", { class: "meta" }, `${r.report_id} · ${r.modality} · ${r.study_date} · ${r.region} · ${r.status} · ${r.reported_by}`),
    el("table", {}, el("tr", {}, el("th", {}, "ID"), el("th", {}, "Site"), el("th", {}, "Finding")), rows),
    el("div", { class: "block" }, el("h3", {}, "Impression"), r.impression),
    el("div", { class: "block" }, el("h3", {}, "Recommendation"), r.recommendation),
    d.other_reports && d.other_reports.length ? el("div", { class: "meta" }, "Other reports: " + d.other_reports.map(o => `${o.modality} ${o.study_date} (${o.report_id})`).join(" · ")) : null
  );
}

async function showReportEvidence(resp) {
  const ev = (resp.evidence || [])[0];
  if (!ev || !ev.report_id) return;
  try {
    const report = await api("/api/reports/" + ev.report_id);
    renderReport({ report, patient: resp.data.patient }, ev.finding_ids);
    $("detail").prepend(el("div", { class: "warn", style: "background:var(--accent-soft);color:var(--accent)" },
      `Source for the last answer: ${ev.report_id}` + (ev.finding_ids.length ? ` · findings ${ev.finding_ids.join(", ")} highlighted` : "")));
  } catch (e) { addError(e.message); }
}

function draftEditable(draft) {
  return draft.findings.map(f => ({
    finding_id: f.finding_id, category: f.category, finding: f.finding, qualifiers: f.qualifiers, present: f.present,
    certainty: f.certainty, tooth_fdi: f.site && f.site.type === "tooth" ? f.site.fdi : null,
    site_label: f.site && f.site.type !== "tooth" ? f.site.label : null
  }));
}

function renderDraft(draft) {
  state.draft = draft;
  const rows = draft.findings.map(f => el("tr", {},
    el("td", { class: "src" }, f.finding_id),
    el("td", {}, f.site ? f.site.label : "—"),
    el("td", { class: f.present ? "" : "neg" }, (f.present ? f.finding : "No " + f.finding.charAt(0).toLowerCase() + f.finding.slice(1)) + (f.qualifiers.length ? ` (${f.qualifiers.join(", ")})` : ""),
      el("div", { class: "ev" }, `“${f.evidence}”`)),
    el("td", {}, f.certainty === "uncertain" ? `uncertain (${f.certainty_cue})` : "stated"),
    el("td", { class: "flag" }, f.review_reasons.join("; "))));
  const editor = el("textarea", { class: "json", id: "draft-json", spellcheck: "false" });
  editor.value = JSON.stringify({ patient_id: draft.patient ? draft.patient.patient_id : null, findings: draftEditable(draft) }, null, 2);
  const approved = draft.status === "clinician_approved";
  fill($("detail"),
    el("div", { class: "pt" }, el("strong", {}, draft.draft_id), el("span", { class: "status " + draft.status }, draft.status.replaceAll("_", " ")),
      el("span", { class: "meta" }, `engine: ${draft.extraction_engine} · v${draft.version}`)),
    el("div", { class: "meta" }, draft.patient ? `Patient: ${draft.patient.name} (${draft.patient.patient_id})` : "Patient: not linked"),
    el("table", {}, el("tr", {}, el("th", {}, "ID"), el("th", {}, "Site"), el("th", {}, "Finding / evidence"), el("th", {}, "Certainty"), el("th", {}, "Review")), rows),
    draft.rejected_findings.length ? el("div", { class: "rejected" }, "Rejected as unsupported: " + draft.rejected_findings.map(r => `${r.proposed.category || "?"} — ${r.reason}`).join(" | ")) : null,
    draft.unparsed_segments.length ? el("div", { class: "warn" }, "Not converted (kept verbatim): " + draft.unparsed_segments.map(s => `“${s}”`).join(" · ")) : null,
    el("div", { class: "block" }, el("h3", {}, "Readable draft"), el("pre", { class: "draft" }, draft.draft_text)),
    approved ? null : el("div", { class: "block" }, el("h3", {}, "Edit structured JSON"), editor,
      el("div", { class: "row", style: "margin-top:8px" },
        el("button", { class: "btn secondary", type: "button", onclick: saveDraft }, "Save edits"),
        el("button", { class: "btn", type: "button", onclick: approveDraft }, "Approve draft")))
  );
}

async function saveDraft() {
  let body;
  try { body = JSON.parse($("draft-json").value); } catch (e) { return addError("JSON is not valid: " + e.message); }
  try { renderDraft(await api(`/api/drafts/${state.draft.draft_id}`, { method: "PUT", json: body })); }
  catch (e) { addError(e.message); }
}

async function approveDraft() {
  try { renderDraft(await api(`/api/drafts/${state.draft.draft_id}/approve`, { method: "POST" })); }
  catch (e) { addError(e.message); }
}

function handleResponse(r) {
  state.sessionId = r.session_id;
  addBot(r);
  if (r.type === "report") renderReport(r.data, []);
  else if (r.type === "draft_report") renderDraft(r.data);
  else if (r.type === "summary" || r.type === "answer") showReportEvidence(r);
}

async function send(text, channel = "text") {
  text = (text || "").trim();
  if (!text) return;
  addUser(text, channel === "voice_browser" ? "🎤 via browser speech" : null);
  $("text").value = "";
  try {
    handleResponse(await api("/api/assistant/message", { method: "POST",
      json: { text, session_id: state.sessionId, mode: $("mode").value, channel } }));
  } catch (e) { addError(e.message); }
}

async function sendAudio(file, label = "uploaded audio") {
  const fd = new FormData();
  fd.append("audio", file);
  if (state.sessionId) fd.append("session_id", state.sessionId);
  fd.append("mode", $("mode").value);
  const pending = el("div", { class: "hint", style: "align-self:flex-end" }, `🎤 ${label}: transcribing…`);
  $("log").append(pending);
  try {
    const r = await api("/api/assistant/voice", { method: "POST", body: fd });
    pending.remove();
    const stt = (r.trace || []).find(s => s.step === "stt");
    addUser(r.transcript || "(no transcript)", `🎤 ${label} → ${stt ? `${stt.detail.provider} STT, ${stt.ms} ms` : "server STT"}`);
    handleResponse(r);
  } catch (e) { pending.remove(); addError(e.message); }
}

// ---- Voice input. Two paths, chosen from /api/config:
//  * server STT (Groq/OpenAI Whisper): record audio with MediaRecorder and post it to /api/assistant/voice
//  * otherwise: browser speech recognition (Chrome/Edge) sends text like typed input
let serverSTT = false, listening = false, recorder = null, chunks = [];
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null;
if (SR) {
  rec = new SR();
  rec.lang = "en-IN"; rec.interimResults = true; rec.continuous = false;
  rec.onresult = (e) => { $("text").value = Array.from(e.results).map(r => r[0].transcript).join(" "); };
  rec.onend = () => { stopUI(); if ($("text").value.trim()) send($("text").value, "voice_browser"); };
  rec.onerror = (e) => { $("mic-hint").textContent = "Mic error: " + e.error; };
}
const canRecord = !!(navigator.mediaDevices && window.MediaRecorder);

function startUI() { listening = true; $("mic").classList.add("listening"); $("mic").textContent = "■ Stop"; }
function stopUI() { listening = false; $("mic").classList.remove("listening"); $("mic").textContent = "🎤 Speak"; }

function setMicMode(sttProvider) {
  serverSTT = ["groq", "openai"].includes(sttProvider) && canRecord;
  if (serverSTT) {
    $("mic").disabled = false;
    $("mic-hint").textContent = `Mic records audio and sends it to ${sttProvider} Whisper on the server. Click again to stop.`;
  } else if (rec) {
    $("mic").disabled = false;
    $("mic-hint").textContent = "Mic uses your browser's speech recognition (en-IN). Set STT_PROVIDER=groq for server-side Whisper.";
  } else {
    $("mic").disabled = true;
    $("mic-hint").textContent = "No voice input available in this browser. Type, or upload an audio file.";
  }
}

async function startRecording() {
  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
  catch (e) { $("mic-hint").textContent = "Microphone permission denied or unavailable."; return; }
  const type = ["audio/webm;codecs=opus", "audio/webm", "audio/mp4", "audio/ogg"].find(t => MediaRecorder.isTypeSupported(t)) || "";
  recorder = new MediaRecorder(stream, type ? { mimeType: type } : undefined);
  chunks = [];
  recorder.ondataavailable = (e) => { if (e.data.size) chunks.push(e.data); };
  recorder.onstop = () => {
    stream.getTracks().forEach(t => t.stop());
    stopUI();
    const mime = (recorder.mimeType || "audio/webm").split(";")[0];
    const ext = mime.includes("mp4") ? "m4a" : mime.includes("ogg") ? "ogg" : "webm";
    if (chunks.length) sendAudio(new File(chunks, `mic.${ext}`, { type: mime }), "recorded");
  };
  recorder.start();
  startUI();
}

$("mic").addEventListener("click", () => {
  if (serverSTT) {
    if (listening && recorder) recorder.stop(); else startRecording();
    return;
  }
  if (!rec) return;
  if (listening) { rec.stop(); return; }
  $("text").value = ""; startUI(); rec.start();
});

$("send").addEventListener("click", () => send($("text").value));
$("text").addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send($("text").value); } });
$("audio").addEventListener("change", (e) => { if (e.target.files[0]) sendAudio(e.target.files[0], e.target.files[0].name); e.target.value = ""; });
$("clinician").addEventListener("change", (e) => { state.clinician = e.target.value; state.sessionId = null;
  addNote(`Switched to ${state.clinician}. New session started.`); });
$("reset").addEventListener("click", () => { state.sessionId = null; state.draft = null; $("log").replaceChildren();
  $("detail").replaceChildren(el("p", { class: "empty" }, "New session.")); });
for (const ex of EXAMPLES) $("examples").append(el("button", { type: "button", onclick: () => { $("text").value = ex; $("text").focus(); } },
  ex.length > 48 ? ex.slice(0, 46) + "…" : ex));

const PROVIDER_LABEL = { groq: "Groq", openai_compat: "LLM" };
setMicMode("mock");
api("/api/config").then(c => {
    $("cfg-interp").textContent = "interpreter: " + (c.llm_model ? `${PROVIDER_LABEL[c.interpreter] || c.interpreter} (${c.llm_model})` : "rule-based");
    if (c.llm_requested && !c.llm_model) {
      $("cfg-interp").textContent = "interpreter: rule-based (LLM not started)";
      $("cfg-interp").title = c.llm_startup_error || "";
      $("cfg-interp").style.background = "var(--warn-soft)";
    }
    $("cfg-stt").textContent = "server STT: " + c.stt_provider + (c.stt_model ? ` (${c.stt_model})` : "");
    setMicMode(c.stt_provider); })
  .catch(() => {});
</script>
</body>
</html>
